experiment:
    name: dinov2-twinlora
    name_suffix: twinlora-rank-8
    seed: 42
    device: auto
    output_dir: ./runs

model:
    name: dinov2_twinlora
    params:
        model_name: facebook/dinov2-small
        dropout: 0.1
        freeze_backbone: true
        twinlora:
            enabled: true
            rank: 8 # LoRA rank r
            shared_rank: 4 # Twin rank s
            alpha: 8.0 # => scaling = 1.0 for LoRA
            twin_alpha: 4.0 # => scaling = 1.0 for Twin
            dropout: 0.05 # light reg on LoRA path
            twin_dropout: 0.0
            init: kaiming

training:
    epochs: 5
    gradient_clip_norm: 1.0
    grad_accumulation: 1
    log_every: 1
    eval_every: 1
    save_every: 1
    optimizer:
        type: adamw
        lr: 0.0003
        weight_decay: 0.05
        betas: [0.9, 0.999]
        eps: 0.00000001
    scheduler:
        type: cosine
        warmup: 0.05
        min_lr_mult: 0.1
    monitor:
        grad_norm: true
        param_norm: true
        memory: true

data:
    root: /speedy/datasets
    image_size: 224
    batch_size: 128
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    normalization: dinov2
    augment: true
    drop_last: true

logging:
    use_wandb: true
    project: fisher-lora
    entity: null
    run_name: null
    group: null
    tags: ["dinov2", "twinlora"]
    notes: null

datasets:
    - name: ImageNet
      val_split: test
      normalization: dinov2
