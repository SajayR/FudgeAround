experiment:
  name: dinov2-baseline
  name_suffix: null
  seed: 42
  device: auto
  output_dir: ./runs

model:
  name: dinov2_lora
  params:
    model_name: facebook/dinov2-small
    dropout: 0.1
    freeze_backbone: false
    lora:
      enabled: true
      r: 16
      alpha: 32
      dropout: 0.1
      target_modules: ["query", "key", "value", "dense"]

training:
  epochs: 5
  gradient_clip_norm: 1.0
  grad_accumulation: 1
  log_every: 20
  eval_every: 1
  save_every: 1
  bs_relora:
    enabled: true
    rank: 16                # low-rank budget r
    oversample: 4           # randomized SVD oversampling p
    power_iterations: 1     # power iters for better spectrum capture
    probe_steps: 32         # K full batches for probe phase
    low_rank_steps: 128     # N batches for low-rank updates
    cycles: 3               # number of (probe + low-rank) repeats
    lambda_u: 0.5           # soft deflation strength (left span)
    lambda_v: 0.5           # soft deflation strength (right span)
    gamma: 0.5              # momentum damp along new span
    alpha_m_limits: [0.05, 0.4]  # momentum shrink bounds
    alpha_v_limits: [0.6, 0.9]   # variance shrink bounds
    rho_eps: 1.0e-12        # stability eps in rho computation
    memory_rank_cap: 64     # cap memory subspace width
    eval_every: 1           # evaluate every X cycles
    save_every: 1           # checkpoint every X cycles
    target_modules: ["query", "key", "value", "dense"]  # layer name filters
    low_rank_optimizer:
      type: adamw
      lr: 0.001             # LR for adapter cores
      weight_decay: 0.0
      betas: [0.9, 0.999]
      eps: 0.00000001
  precision:
    enabled: true
    dtype: bf16
    grad_scaler: false
  optimizer:
    type: adamw
    lr: 0.0003
    weight_decay: 0.05
    betas: [0.9, 0.999]
    eps: 0.00000001
  scheduler:
    type: cosine
    warmup: 0.05
    min_lr_mult: 0.1
  monitor:
    grad_norm: true
    param_norm: true
    memory: true

data:
  root: /speedy/datasets
  image_size: 224
  batch_size: 128
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  normalization: imagenet
  augment: true
  drop_last: true

logging:
  use_wandb: true
  project: cis-testbed
  entity: null
  run_name: null
  group: null
  tags: ["dinov2", "baseline"]
  notes: null

datasets:
  - name: cifar-10
    val_split: test
    normalization: cifar10
  - name: flowers-102
    val_split: test
    batch_size: 64
