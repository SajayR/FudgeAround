experiment:
    name: dinov2-combo-twinlora
    name_suffix: combo-twinlora-rank-8
    seed: 42
    device: auto
    output_dir: ./runs

model:
    name: dinov2_combotwinlora
    params:
        model_name: facebook/dinov2-small
        dropout: 0.0
        freeze_backbone: true
        lora:
            enabled: true
            r: 12
            alpha: 24
            dropout: 0.00
            target_modules: ["query", "key", "value", "dense"]
        twinlora:
            enabled: true
            rank: 8
            shared_rank: 4
            alpha: 8.0
            twin_alpha: 4.0
            dropout: 0.00
            twin_dropout: 0.0

training:
    epochs: 10
    gradient_clip_norm: 1.0
    grad_accumulation: 1
    log_every: 1
    eval_every: 1
    save_every: 1
    optimizer:
        type: adamw
        lr: 0.0003
        weight_decay: 0.05
        betas: [0.9, 0.999]
        eps: 0.00000001
    scheduler:
        type: cosine
        warmup: 0.05
        min_lr_mult: 0.1
    monitor:
        grad_norm: true
        param_norm: true
        memory: true

data:
    root: /speedy/datasets
    image_size: 224
    batch_size: 128
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    normalization: dinov2
    augment: true
    drop_last: true

logging:
    use_wandb: true
    project: TwinLoRA
    entity: null
    run_name: null
    group: null
    tags: ["dinov2", "combo", "twinlora"]
    notes: null

datasets:
    - name: ImageNet
      val_split: test
      normalization: dinov2
